name: Prepare self-hosted scenery media

# This workflow runs only when the preparation script or workflow changes
# on the dedicated owner-controlled asset branch. Generated media commits
# do not retrigger the workflow.
on:
  push:
    branches:
      - feat/self-hosted-scenery-20261022
    paths:
      - tools/prepare-home-media.sh
      - .github/workflows/prepare-home-media.yml

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout media branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install media tooling
        run: |
          command -v ffmpeg || sudo apt-get update && sudo apt-get install -y ffmpeg
          command -v ffprobe
      - name: Prepare four local scenes
        run: bash tools/prepare-home-media.sh
      - name: Commit validated generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro-static/scenes/*.mp4 astro-static/scenes/*.webp
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "assets(home): host four compact scenic videos and WebP posters"
            git push origin HEAD:feat/self-hosted-scenery-20261022
          fi
