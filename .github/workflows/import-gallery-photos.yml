name: One-time import of full-bleed gallery photography
on:
  push:
    branches: [fix/photo-fullbleed-home-20261022]
    paths:
      - tools/import-gallery-photos.sh
      - .github/workflows/import-gallery-photos.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check image preparation tools
        run: |
          command -v ffmpeg
          command -v ffprobe
      - name: Fetch and optimize four licensed still photographs
        run: bash tools/import-gallery-photos.sh
      - name: Commit new photo gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro-static/scenes/gallery-*.webp
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "assets(home): add full-resolution landscape photos distinct from old video frames"
            git push origin HEAD:fix/photo-fullbleed-home-20261022
          fi
