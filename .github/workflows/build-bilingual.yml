name: Build and audit bilingual site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate JavaScript entrypoints
        run: |
          node --check tools/content-records.js
          node --check tools/check-runtime.js
          node --check tools/validate-bilingual.js
          node --check tools/new-bilingual-post.js
          node --check tools/output-hash.js
          node --check tools/finalize-service-worker.js
          node --check tools/postprocess-astro.cjs
          node --check tools/audit-astro.cjs
          node --check tools/check-articles.js

      - name: Build and audit production output
        run: npm run check

      - name: Upload generated site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-astro-${{ github.sha }}
          path: astro-dist
          if-no-files-found: error
          retention-days: 7

      - name: Note publish path
        if: github.event_name != 'pull_request'
        run: echo "EdgeOne 发布由 edgeone-page 项目的 GitHub 集成完成；CI 只负责构建与审计，构建产物见上方 artifact。"
