name: One-shot install official EdgeOne Makers skills
on:
  push:
    branches: [V1]
    paths:
      - .github/maintenance/install-edgeone-skills-trigger.txt

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V1
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Install official EdgeOne Makers skills to the repository
        run: |
          set -euo pipefail
          npx --yes skills add TencentEdgeOne/edgeone-makers-tools -a codex -y --copy
          test -s .agents/skills/edgeone-makers-tools/SKILL.md
          test -s .agents/skills/edgeone-makers-tools/references/makers-agents/SKILL.md
          test -s .agents/skills/edgeone-makers-tools/references/makers-deploy/SKILL.md
          echo "Official Skill tree installed."

      - name: Commit installed official Skills on V1 only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills
          if git diff --cached --quiet; then
            echo "Skills already installed. No commit needed."
          else
            git commit -m "chore(devtools): install official EdgeOne Makers skills for Codex"
            git push origin HEAD:V1
          fi
