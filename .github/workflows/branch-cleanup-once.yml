name: One-shot historical branch cleanup
on:
  push:
    branches:
      - V1
    paths:
      - .github/maintenance/branch-cleanup-trigger.txt

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'FukunHennan/edgeone-page'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify, archive and delete superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          assert_head() {
            local name="$1" expected="$2" actual
            actual="$(gh api "repos/${GH_REPO}/git/ref/heads/${name}" --jq '.object.sha')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Branch $name moved: $actual (expected $expected). Nothing deleted."
              exit 1
            fi
            echo "Verified $name @ $actual"
          }
          assert_head "codex/cloud-autodev-bootstrap-20261028" "d3897b5d27bf63cbc647e5c52f7ce2c3adaa45fe"
          assert_head "fix/home-viewport-cover-20261022" "15aeaf06952b0eb2d3b2d41897cb6164dcf60d66"
          assert_head "feat/makers-site-agent-v1" "e813d5579e35ddae68debc6c8b894848cacd3c4a"
          # Preserve independently authored work as tags, not branches.
          gh api -X POST "repos/${GH_REPO}/git/refs" \
            -f ref="refs/tags/archive/codex-cloud-autodev-20261028" \
            -f sha="d3897b5d27bf63cbc647e5c52f7ce2c3adaa45fe" >/dev/null
          gh api -X POST "repos/${GH_REPO}/git/refs" \
            -f ref="refs/tags/archive/home-viewport-cover-20261022" \
            -f sha="15aeaf06952b0eb2d3b2d41897cb6164dcf60d66" >/dev/null
          for name in \
            "codex/cloud-autodev-bootstrap-20261028" \
            "fix/home-viewport-cover-20261022" \
            "feat/makers-site-agent-v1"; do
            # Recheck immediately before deleting to avoid clobbering new work.
            case "$name" in
              "codex/cloud-autodev-bootstrap-20261028") expected="d3897b5d27bf63cbc647e5c52f7ce2c3adaa45fe";;
              "fix/home-viewport-cover-20261022") expected="15aeaf06952b0eb2d3b2d41897cb6164dcf60d66";;
              "feat/makers-site-agent-v1") expected="e813d5579e35ddae68debc6c8b894848cacd3c4a";;
            esac
            assert_head "$name" "$expected"
            gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${name}" >/dev/null
            echo "Deleted $name"
          done
