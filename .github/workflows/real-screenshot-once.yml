name: Capture real rendered V1 site (one shot)

on:
  push:
    branches: [V1]
    paths:
      - .github/maintenance/real-screenshot-trigger.txt

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Build the actual current V1 website
        run: |
          npm ci --ignore-scripts
          npm run build:production
      - name: Capture actual pages with headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p docs/screenshots
          cd astro-dist
          python3 -m http.server 4321 --bind 127.0.0.1 >/tmp/edgeone-preview-http.log 2>&1 &
          echo $! >/tmp/edgeone-preview-pid
          cd ..
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4321/zh-CN/agent/; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:4321/zh-CN/agent/
          timeout 60s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1536,960 --force-device-scale-factor=1 --virtual-time-budget=3000 --screenshot="$PWD/docs/screenshots/v1-agent-real-chromium.png" http://127.0.0.1:4321/zh-CN/agent/ || true
          timeout 60s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1536,960 --force-device-scale-factor=1 --virtual-time-budget=3000 --screenshot="$PWD/docs/screenshots/v1-home-real-chromium.png" http://127.0.0.1:4321/zh-CN/ || true
          test -s docs/screenshots/v1-agent-real-chromium.png
          test -s docs/screenshots/v1-home-real-chromium.png
          file docs/screenshots/*.png
      - name: Commit unedited real browser screenshots to V1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/v1-agent-real-chromium.png docs/screenshots/v1-home-real-chromium.png
          git commit -m "docs: capture real Chromium renders of V1 homepage and Agent page"
          git push origin HEAD:V1
      - name: Save screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-v1-site-chromium-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: warn
