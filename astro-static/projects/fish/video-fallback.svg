<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" role="img" aria-labelledby="title desc">
<title id="title">Video transport path selection</title><desc id="desc">The current selector checks ICE and delivered frames; IP subnet comparison is not used.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:26px;font-weight:700}.title{font-size:19px;font-weight:700;text-anchor:middle}.detail{font-size:16px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:21px;font-weight:700}.lane-detail{font-size:16px;fill:#4c5a55}.edge-label{font-size:14px;text-anchor:middle;fill:#53645e}.footer{font-size:15px;fill:#64716d}</style>
<rect width="1160" height="420" fill="#fff"/><text x="30" y="44" class="heading">Video transport path selection</text>
<g><polyline points="340,215 425,215" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="382" y="115" class="edge-label">failed / stale</text></g>
<g><polyline points="735,215 820,215" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="778" y="115" class="edge-label">failed / no TURN</text></g>
<g><rect x="30" y="132" width="310" height="166" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="185" y="163" class="title">1. Direct WebRTC</text><text x="185" y="191" class="detail">Host candidates only</text><text x="185" y="210" class="detail">ICE + first and fresh frames</text><text x="185" y="229" class="detail">Stay while video is usable</text></g>
<g><rect x="425" y="132" width="310" height="166" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="580" y="163" class="title">2. TURN relay</text><text x="580" y="191" class="detail">Relay candidates only</text><text x="580" y="210" class="detail">ICE + first and fresh frames</text><text x="580" y="229" class="detail">Stay while video is usable</text></g>
<g><rect x="820" y="132" width="310" height="166" rx="6" fill="#e9f5f3" stroke="#3e7771" stroke-width="1.5"/><text x="975" y="163" class="title">3. JPEG snapshots</text><text x="975" y="191" class="detail">Same-origin WebSocket via Go</text><text x="975" y="210" class="detail">Send the newest frame only</text><text x="975" y="229" class="detail">Reconnect snapshots on failure</text></g>
<text x="30" y="394" class="footer">The current selector checks ICE and delivered frames; IP subnet comparison is not used.</text></svg>
