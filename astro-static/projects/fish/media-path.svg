<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 445" role="img" aria-labelledby="title desc">
<title id="title">Signaling and media are separate paths</title><desc id="desc">The Go origin carries signaling and JPEG fallback; normal WebRTC frames bypass it.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:26px;font-weight:700}.title{font-size:19px;font-weight:700;text-anchor:middle}.detail{font-size:16px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:21px;font-weight:700}.lane-detail{font-size:16px;fill:#4c5a55}.edge-label{font-size:14px;text-anchor:middle;fill:#53645e}.footer{font-size:15px;fill:#64716d}</style>
<rect width="1160" height="445" fill="#fff"/><text x="30" y="44" class="heading">Signaling and media are separate paths</text>
<g><polyline points="290,156 450,156" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="370" y="135" class="edge-label">offer</text></g>
<g><polyline points="710,156 870,156" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="790" y="135" class="edge-label">local API</text></g>
<g><rect x="30" y="104" width="260" height="105" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="160" y="135" class="title">Browser</text><text x="160" y="163" class="detail">Session + viewing rights</text></g>
<g><rect x="450" y="104" width="260" height="105" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="580" y="135" class="title">Go signaling</text><text x="580" y="163" class="detail">Offer / answer proxy</text></g>
<g><rect x="870" y="104" width="260" height="105" rx="6" fill="#e9f5f3" stroke="#3e7771" stroke-width="1.5"/><text x="1000" y="135" class="title">Python video</text><text x="1000" y="163" class="detail">Capture + aiortc</text></g>
<g><rect x="30" y="280" width="335" height="96" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="197.5" y="311" class="title">Direct media</text><text x="197.5" y="339" class="detail">Python → browser</text><text x="197.5" y="358" class="detail">Host ICE candidates</text></g>
<g><rect x="412" y="280" width="335" height="96" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="579.5" y="311" class="title">TURN relay</text><text x="579.5" y="339" class="detail">Python → TURN → browser</text><text x="579.5" y="358" class="detail">Temporary relay credentials</text></g>
<g><rect x="794" y="280" width="335" height="96" rx="6" fill="#fff3e8" stroke="#aa7447" stroke-width="1.5"/><text x="961.5" y="311" class="title">JPEG fallback</text><text x="961.5" y="339" class="detail">Python → Go → browser</text><text x="961.5" y="358" class="detail">Same-origin WebSocket</text></g>
<text x="30" y="419" class="footer">The Go origin carries signaling and JPEG fallback; normal WebRTC frames bypass it.</text></svg>
