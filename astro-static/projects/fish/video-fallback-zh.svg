<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" role="img" aria-labelledby="title desc">
<title id="title">视频传输路径选择</title><desc id="desc">当前选路依据 ICE 与实际画面；IP 网段比较没有参与。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:30px;font-weight:700}.title{font-size:22px;font-weight:700;text-anchor:middle}.detail{font-size:18px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:23px;font-weight:700}.lane-detail{font-size:18px;fill:#4c5a55}.edge-label{font-size:16px;text-anchor:middle;fill:#53645e}.footer{font-size:17px;fill:#64716d}</style>
<rect width="1160" height="420" fill="#fff"/><text x="30" y="44" class="heading">视频传输路径选择</text>
<g><polyline points="340,215 425,215" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="382" y="115" class="edge-label">失败 / 停帧</text></g>
<g><polyline points="735,215 820,215" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="778" y="115" class="edge-label">失败 / 无 TURN</text></g>
<g><rect x="30" y="132" width="310" height="166" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="185" y="163" class="title">1. WebRTC 直连</text><text x="185" y="191" class="detail">仅使用 host 候选</text><text x="185" y="210" class="detail">检查 ICE、首帧与后续画面</text><text x="185" y="229" class="detail">画面可用则保持</text></g>
<g><rect x="425" y="132" width="310" height="166" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="580" y="163" class="title">2. TURN 中继</text><text x="580" y="191" class="detail">仅使用 relay 候选</text><text x="580" y="210" class="detail">检查 ICE、首帧与后续画面</text><text x="580" y="229" class="detail">画面可用则保持</text></g>
<g><rect x="820" y="132" width="310" height="166" rx="6" fill="#e9f5f3" stroke="#3e7771" stroke-width="1.5"/><text x="975" y="163" class="title">3. JPEG 快照</text><text x="975" y="191" class="detail">经 Go 的同源 WebSocket</text><text x="975" y="210" class="detail">只转发最新画面</text><text x="975" y="229" class="detail">断线后重连快照</text></g>
<text x="30" y="394" class="footer">当前选路依据 ICE 与实际画面；IP 网段比较没有参与。</text></svg>
