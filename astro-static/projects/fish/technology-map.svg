<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" role="img" aria-labelledby="title desc">
<title id="title">Technology and responsibilities</title><desc id="desc">These rows describe responsibilities, not a single sequential call path.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:26px;font-weight:700}.title{font-size:19px;font-weight:700;text-anchor:middle}.detail{font-size:16px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:21px;font-weight:700}.lane-detail{font-size:16px;fill:#4c5a55}.edge-label{font-size:14px;text-anchor:middle;fill:#53645e}.footer{font-size:15px;fill:#64716d}</style>
<rect width="850" height="550" fill="#fff"/><text x="30" y="44" class="heading">Technology and responsibilities</text>

<g><rect x="40" y="86" width="770" height="88" rx="5" fill="#edf4ee" stroke="#58775e" stroke-width="1.4"/><rect x="40" y="86" width="8" height="88" fill="#58775e"/><text x="65" y="139" class="lane-title">Browser interfaces</text><text x="286" y="120" class="lane-detail">HTML / CSS / JavaScript + React / Vite</text><text x="286" y="147" class="lane-detail">Player and referee workflows; device administration</text></g>
<g><rect x="40" y="188" width="770" height="88" rx="5" fill="#edf3f9" stroke="#537391" stroke-width="1.4"/><rect x="40" y="188" width="8" height="88" fill="#537391"/><text x="65" y="241" class="lane-title">Control hub</text><text x="286" y="222" class="lane-detail">Go + Gorilla WebSocket</text><text x="286" y="249" class="lane-detail">Identity, leases, commands, match state</text></g>
<g><rect x="40" y="290" width="770" height="88" rx="5" fill="#fff3e8" stroke="#aa7447" stroke-width="1.4"/><rect x="40" y="290" width="8" height="88" fill="#aa7447"/><text x="65" y="343" class="lane-title">Device firmware</text><text x="286" y="324" class="lane-detail">ESP32-C3 + Arduino / PlatformIO</text><text x="286" y="351" class="lane-detail">Servo motion, telemetry, local stop checks</text></g>
<g><rect x="40" y="392" width="770" height="88" rx="5" fill="#e9f5f3" stroke="#3e7771" stroke-width="1.4"/><rect x="40" y="392" width="8" height="88" fill="#3e7771"/><text x="65" y="445" class="lane-title">Camera and video</text><text x="286" y="426" class="lane-detail">Python + OpenCV / Flask / aiortc / PyAV</text><text x="286" y="453" class="lane-detail">Capture, framing, streaming, recording</text></g>
<text x="30" y="524" class="footer">These rows describe responsibilities, not a single sequential call path.</text></svg>
