<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">Fish 系统架构</title><desc id="desc">控制与视频分开传输；JPEG 降级流经过同源 Go 入口。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:30px;font-weight:700}.title{font-size:22px;font-weight:700;text-anchor:middle}.detail{font-size:18px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:23px;font-weight:700}.lane-detail{font-size:18px;fill:#4c5a55}.edge-label{font-size:16px;text-anchor:middle;fill:#53645e}.footer{font-size:17px;fill:#64716d}</style>
<rect width="1120" height="510" fill="#fff"/><text x="30" y="44" class="heading">Fish 系统架构</text>
<g><polyline points="274,231 392,231" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="333" y="151" class="edge-label">HTTP / WebSocket</text></g>
<g><polyline points="680,201 756,201 756,123 850,123" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="768" y="103" class="edge-label">WebSocket / JSON</text></g>
<g><polyline points="680,256 750,256 750,353 850,353" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="761" y="332" class="edge-label">相机 API / JPEG 代理</text></g>
<g><polyline points="850,388 802,388 802,458 155,458 155,292" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="510" y="440" class="edge-label">直连 / TURN 视频</text></g>
<g><rect x="36" y="170" width="238" height="122" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="155" y="201" class="title">浏览器</text><text x="155" y="229" class="detail">选手 / 裁判 / 管理员</text><text x="155" y="248" class="detail">React 管理台 + 赛事页</text></g>
<g><rect x="392" y="170" width="288" height="122" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="536" y="201" class="title">Go 控制器 :8081</text><text x="536" y="229" class="detail">身份、租约、赛事状态</text><text x="536" y="248" class="detail">指令、API、视频代理</text></g>
<g><rect x="850" y="65" width="232" height="116" rx="6" fill="#fff3e8" stroke="#aa7447" stroke-width="1.5"/><text x="966" y="96" class="title">ESP32-C3 固件</text><text x="966" y="124" class="detail">运动与状态回传</text><text x="966" y="143" class="detail">Arduino / PlatformIO</text></g>
<g><rect x="850" y="292" width="232" height="122" rx="6" fill="#e9f5f3" stroke="#3e7771" stroke-width="1.5"/><text x="966" y="323" class="title">Python 视频 :8091</text><text x="966" y="351" class="detail">相机、WebRTC、录像</text><text x="966" y="370" class="detail">OpenCV / aiortc / Flask</text></g>
<text x="30" y="484" class="footer">控制与视频分开传输；JPEG 降级流经过同源 Go 入口。</text></svg>
