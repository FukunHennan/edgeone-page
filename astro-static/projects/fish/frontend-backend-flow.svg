<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc">
<title id="title">Frontend and backend request flow</title><desc id="desc">Go handles control and signaling. Normal WebRTC media does not pass through Go.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:26px;font-weight:700}.title{font-size:19px;font-weight:700;text-anchor:middle}.detail{font-size:16px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:21px;font-weight:700}.lane-detail{font-size:16px;fill:#4c5a55}.edge-label{font-size:14px;text-anchor:middle;fill:#53645e}.footer{font-size:15px;fill:#64716d}</style>
<rect width="1000" height="475" fill="#fff"/><text x="30" y="44" class="heading">Frontend and backend request flow</text>
<g><polyline points="270,183 380,183" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="325" y="105" class="edge-label">HTTP / WebSocket</text></g>
<g><polyline points="620,183 730,183" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="675" y="105" class="edge-label">device WS / JSON</text></g>
<g><polyline points="500,246 500,320" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="611" y="288" class="edge-label">video API / signaling</text></g>
<g><polyline points="380,371 150,371 150,246" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="265" y="352" class="edge-label">direct / TURN media</text></g>
<g><rect x="30" y="120" width="240" height="126" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="150" y="151" class="title">Browser frontend</text><text x="150" y="179" class="detail">Match page + admin console</text><text x="150" y="198" class="detail">Input and video display</text></g>
<g><rect x="380" y="120" width="240" height="126" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="500" y="151" class="title">Go service</text><text x="500" y="179" class="detail">Accounts + match state</text><text x="500" y="198" class="detail">Control admission + API</text></g>
<g><rect x="730" y="120" width="240" height="126" rx="6" fill="#fff3e8" stroke="#aa7447" stroke-width="1.5"/><text x="850" y="151" class="title">ESP32 firmware</text><text x="850" y="179" class="detail">Motion + telemetry</text><text x="850" y="198" class="detail">Local stop checks</text></g>
<g><rect x="380" y="320" width="240" height="102" rx="6" fill="#e9f5f3" stroke="#3e7771" stroke-width="1.5"/><text x="500" y="351" class="title">Python video</text><text x="500" y="379" class="detail">Camera + WebRTC + recording</text></g>
<text x="30" y="449" class="footer">Go handles control and signaling. Normal WebRTC media does not pass through Go.</text></svg>
