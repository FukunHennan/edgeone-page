<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-labelledby="title desc">
<title id="title">三类校验，各有边界</title><desc id="desc">注册、运动准入和 OTA 完成分别需要不同证据。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:30px;font-weight:700}.title{font-size:22px;font-weight:700;text-anchor:middle}.detail{font-size:18px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:23px;font-weight:700}.lane-detail{font-size:18px;fill:#4c5a55}.edge-label{font-size:16px;text-anchor:middle;fill:#53645e}.footer{font-size:17px;fill:#64716d}</style>
<rect width="900" height="345" fill="#fff"/><text x="30" y="44" class="heading">三类校验，各有边界</text>

<g><rect x="30" y="102" width="260" height="172" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="160" y="133" class="title">设备身份</text><text x="160" y="161" class="detail">注册时 HMAC 挑战应答</text><text x="160" y="180" class="detail">共享部署密钥</text><text x="160" y="199" class="detail">nonce + 规范化 MAC</text></g>
<g><rect x="320" y="102" width="260" height="172" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="450" y="133" class="title">控制归属</text><text x="450" y="161" class="detail">设备 + 账号 + 客户端租约</text><text x="450" y="180" class="detail">拒绝过期和越权操作</text><text x="450" y="199" class="detail">停止时清除旧运动</text></g>
<g><rect x="610" y="102" width="260" height="172" rx="6" fill="#fff3e8" stroke="#aa7447" stroke-width="1.5"/><text x="740" y="133" class="title">升级结果</text><text x="740" y="161" class="detail">SHA-256 镜像校验</text><text x="740" y="180" class="detail">重启并重新上线</text><text x="740" y="199" class="detail">新 bootId + 版本 + 构建</text></g>
<text x="30" y="319" class="footer">注册、运动准入和 OTA 完成分别需要不同证据。</text></svg>
