<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Motion command lifecycle</title><desc id="desc">The lease, queued-command deadline, and firmware connectivity checks are distinct boundaries.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:26px;font-weight:700}.title{font-size:19px;font-weight:700;text-anchor:middle}.detail{font-size:16px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:21px;font-weight:700}.lane-detail{font-size:16px;fill:#4c5a55}.edge-label{font-size:14px;text-anchor:middle;fill:#53645e}.footer{font-size:15px;fill:#64716d}</style>
<rect width="1200" height="490" fill="#fff"/><text x="30" y="44" class="heading">Motion command lifecycle</text>
<g><polyline points="216,203 263,203" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /></g>
<g><polyline points="453,203 500,203" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /></g>
<g><polyline points="690,203 737,203" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /></g>
<g><polyline points="927,203 974,203" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /></g>
<g><polyline points="358,255 358,310 475,310 475,342" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="398" y="297" class="edge-label">invalid</text></g>
<g><polyline points="595,255 595,310 475,310 475,342" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="576" y="291" class="edge-label">expired / other owner</text></g>
<g><polyline points="832,255 832,342" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="870" y="301" class="edge-label">timeout</text></g>
<g><polyline points="967,382 1072,382 1072,255" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/></g>
<g><rect x="30" y="150" width="186" height="105" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="123" y="181" class="title">Browser input</text><text x="123" y="209" class="detail">Key / button</text><text x="123" y="228" class="detail">Account + client</text></g>
<g><rect x="263" y="150" width="190" height="105" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="358" y="181" class="title">Go admission</text><text x="358" y="209" class="detail">Session + role</text><text x="358" y="228" class="detail">Device assigned?</text></g>
<g><rect x="500" y="150" width="190" height="105" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="595" y="181" class="title">Control lease</text><text x="595" y="209" class="detail">Device + account</text><text x="595" y="228" class="detail">Browser client + TTL</text></g>
<g><rect x="737" y="150" width="190" height="105" rx="6" fill="#e9f5f3" stroke="#3e7771" stroke-width="1.5"/><text x="832" y="181" class="title">Motion queue</text><text x="832" y="209" class="detail">Expiry before send</text><text x="832" y="228" class="detail">STOP clears stale motion</text></g>
<g><rect x="974" y="150" width="196" height="105" rx="6" fill="#fff3e8" stroke="#aa7447" stroke-width="1.5"/><text x="1072" y="181" class="title">ESP32 firmware</text><text x="1072" y="209" class="detail">Servo motion</text><text x="1072" y="228" class="detail">Heartbeat / stop checks</text></g>
<g><rect x="380" y="342" width="190" height="80" rx="6" fill="#f1f2f1" stroke="#7a8580" stroke-width="1.5"/><text x="475" y="373" class="title">Reject command</text><text x="475" y="401" class="detail">No motion sent</text></g>
<g><rect x="777" y="342" width="190" height="80" rx="6" fill="#fff3e8" stroke="#aa7447" stroke-width="1.5"/><text x="872" y="373" class="title">STOP + reset</text><text x="872" y="401" class="detail">Lease / motion expiry</text></g>
<text x="30" y="464" class="footer">The lease, queued-command deadline, and firmware connectivity checks are distinct boundaries.</text></svg>
