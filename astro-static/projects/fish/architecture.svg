<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">Fish system architecture</title><desc id="desc">Control and media have separate paths. The JPEG fallback passes through the Go origin.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:26px;font-weight:700}.title{font-size:19px;font-weight:700;text-anchor:middle}.detail{font-size:16px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:21px;font-weight:700}.lane-detail{font-size:16px;fill:#4c5a55}.edge-label{font-size:14px;text-anchor:middle;fill:#53645e}.footer{font-size:15px;fill:#64716d}</style>
<rect width="1120" height="510" fill="#fff"/><text x="30" y="44" class="heading">Fish system architecture</text>
<g><polyline points="274,231 392,231" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="333" y="151" class="edge-label">HTTP + WebSocket</text></g>
<g><polyline points="680,201 756,201 756,123 850,123" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="768" y="103" class="edge-label">WebSocket / JSON</text></g>
<g><polyline points="680,256 750,256 750,353 850,353" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="761" y="332" class="edge-label">camera API / JPEG proxy</text></g>
<g><polyline points="850,388 802,388 802,458 155,458 155,292" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="510" y="440" class="edge-label">direct / TURN WebRTC media</text></g>
<g><rect x="36" y="170" width="238" height="122" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="155" y="201" class="title">Browser</text><text x="155" y="229" class="detail">Player / referee / admin</text><text x="155" y="248" class="detail">React console + HTML match UI</text></g>
<g><rect x="392" y="170" width="288" height="122" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="536" y="201" class="title">Go controller :8081</text><text x="536" y="229" class="detail">Identity, leases, match state</text><text x="536" y="248" class="detail">Commands, API, video proxy</text></g>
<g><rect x="850" y="65" width="232" height="116" rx="6" fill="#fff3e8" stroke="#aa7447" stroke-width="1.5"/><text x="966" y="96" class="title">ESP32-C3 firmware</text><text x="966" y="124" class="detail">Motion + telemetry</text><text x="966" y="143" class="detail">Arduino / PlatformIO</text></g>
<g><rect x="850" y="292" width="232" height="122" rx="6" fill="#e9f5f3" stroke="#3e7771" stroke-width="1.5"/><text x="966" y="323" class="title">Python video :8091</text><text x="966" y="351" class="detail">Camera, WebRTC, recording</text><text x="966" y="370" class="detail">OpenCV / aiortc / Flask</text></g>
<text x="30" y="484" class="footer">Control and media have separate paths. The JPEG fallback passes through the Go origin.</text></svg>
