<g><rect x="565" y="145" width="220" height="116" rx="6" fill="#e9f5f3" stroke="#3e7771" stroke-width="1.5"/><text x="675" y="176" class="title">验证画面</text><text x="675" y="204" class="detail">ICE 连通</text><text x="675" y="223" class="detail">首帧 + 后续画面</text></g>
<g><rect x="835" y="65" width="235" height="112" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="952.5" y="96" class="title">直连可用</text><text x="952.5" y="124" class="detail">保持当前画面</text></g>
