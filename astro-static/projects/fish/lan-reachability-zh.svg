<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">浏览器能否使用直连视频路径？</title><desc id="desc">当前程序依据 ICE 与实际画面判断，不通过 IP 比较认定局域网。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:30px;font-weight:700}.title{font-size:22px;font-weight:700;text-anchor:middle}.detail{font-size:18px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:23px;font-weight:700}.lane-detail{font-size:18px;fill:#4c5a55}.edge-label{font-size:16px;text-anchor:middle;fill:#53645e}.footer{font-size:17px;fill:#64716d}</style>
<rect width="1100" height="440" fill="#fff"/><text x="30" y="44" class="heading">浏览器能否使用直连视频路径？</text>
<g><polyline points="245,203 295,203" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /></g>
<g><polyline points="515,203 565,203" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /></g>
<g><polyline points="785,178 810,178 810,121 835,121" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="796" y="95" class="edge-label">可用</text></g>
<g><polyline points="785,228 810,228 810,311 835,311" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="796" y="289" class="edge-label">失败</text></g>
<g><rect x="25" y="145" width="220" height="116" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="135" y="176" class="title">打开网站</text><text x="135" y="204" class="detail">稳定域名经 Tunnel</text><text x="135" y="223" class="detail">网页入口可达</text></g>
