<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">Can the browser use a direct media path?</title><desc id="desc">The current selector tests ICE and delivered frames; it does not classify LAN access by IP.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:26px;font-weight:700}.title{font-size:19px;font-weight:700;text-anchor:middle}.detail{font-size:16px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:21px;font-weight:700}.lane-detail{font-size:16px;fill:#4c5a55}.edge-label{font-size:14px;text-anchor:middle;fill:#53645e}.footer{font-size:15px;fill:#64716d}</style>
<rect width="1100" height="440" fill="#fff"/><text x="30" y="44" class="heading">Can the browser use a direct media path?</text>
<g><polyline points="245,203 295,203" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /></g>
<g><polyline points="515,203 565,203" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /></g>
<g><polyline points="785,178 810,178 810,121 835,121" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="796" y="95" class="edge-label">usable</text></g>
<g><polyline points="785,228 810,228 810,311 835,311" fill="none" stroke="#65756f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="796" y="289" class="edge-label">failed</text></g>
<g><rect x="25" y="145" width="220" height="116" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="135" y="176" class="title">Open the website</text><text x="135" y="204" class="detail">Stable domain via Tunnel</text><text x="135" y="223" class="detail">Web entry responds</text></g>
<g><rect x="295" y="145" width="220" height="116" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="405" y="176" class="title">Try host candidates</text><text x="405" y="204" class="detail">Browser + Python</text><text x="405" y="223" class="detail">No TURN in this stage</text></g>
<g><rect x="565" y="145" width="220" height="116" rx="6" fill="#e9f5f3" stroke="#3e7771" stroke-width="1.5"/><text x="675" y="176" class="title">Verify media</text><text x="675" y="204" class="detail">ICE connection</text><text x="675" y="223" class="detail">First + fresh frames</text></g>
<g><rect x="835" y="65" width="235" height="112" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="952.5" y="96" class="title">Direct path works</text><text x="952.5" y="124" class="detail">Keep the usable video</text></g>
<g><rect x="835" y="255" width="235" height="112" rx="6" fill="#fff3e8" stroke="#aa7447" stroke-width="1.5"/><text x="952.5" y="286" class="title">Direct path fails</text><text x="952.5" y="314" class="detail">Continue to other paths</text></g>
<text x="30" y="414" class="footer">The current selector tests ICE and delivered frames; it does not classify LAN access by IP.</text></svg>
