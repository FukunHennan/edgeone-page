<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-labelledby="title desc">
<title id="title">Three different checks</title><desc id="desc">Registration, motion admission, and OTA completion need separate evidence.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#65756f" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#263630}.heading{font-size:26px;font-weight:700}.title{font-size:19px;font-weight:700;text-anchor:middle}.detail{font-size:16px;text-anchor:middle;fill:#4c5a55}.lane-title{font-size:21px;font-weight:700}.lane-detail{font-size:16px;fill:#4c5a55}.edge-label{font-size:14px;text-anchor:middle;fill:#53645e}.footer{font-size:15px;fill:#64716d}</style>
<rect width="900" height="345" fill="#fff"/><text x="30" y="44" class="heading">Three different checks</text>

<g><rect x="30" y="102" width="260" height="172" rx="6" fill="#edf4ee" stroke="#58775e" stroke-width="1.5"/><text x="160" y="133" class="title">Device identity</text><text x="160" y="161" class="detail">HMAC challenge at registration</text><text x="160" y="180" class="detail">Shared deployment key</text><text x="160" y="199" class="detail">Nonce + normalized MAC</text></g>
<g><rect x="320" y="102" width="260" height="172" rx="6" fill="#edf3f9" stroke="#537391" stroke-width="1.5"/><text x="450" y="133" class="title">Control ownership</text><text x="450" y="161" class="detail">Device + account + client lease</text><text x="450" y="180" class="detail">Reject stale or other-owner input</text><text x="450" y="199" class="detail">Clear queued motion on stop</text></g>
<g><rect x="610" y="102" width="260" height="172" rx="6" fill="#fff3e8" stroke="#aa7447" stroke-width="1.5"/><text x="740" y="133" class="title">Firmware result</text><text x="740" y="161" class="detail">SHA-256 image check</text><text x="740" y="180" class="detail">Reboot and reconnect</text><text x="740" y="199" class="detail">New bootId + version + build</text></g>
<text x="30" y="319" class="footer">Registration, motion admission, and OTA completion need separate evidence.</text></svg>
