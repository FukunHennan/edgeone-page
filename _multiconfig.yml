title: EdgeOne Page
subtitle: Modern bilingual Hexo publishing
description: >-
  A Simplified Chinese and English Hexo site optimized for Tencent EdgeOne
  Pages.
keywords:
  - Hexo
  - EdgeOne Pages
  - 简体中文
  - English
author: FukunHennan
language: en
timezone: Asia/Shanghai
url: https://edgeone.chenfukun.space/en
root: /en/
permalink: posts/:title/
permalink_defaults: null
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source/en
public_dir: public/en
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render: []
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
    - edgeone.chenfukun.space
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: '  '
index_generator:
  path: ''
  per_page: 8
  order_by: '-date'
default_category: general
category_map: null
tag_map: null
meta_generator: false
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 8
pagination_dir: page
include: null
exclude: null
ignore:
  - '**/*.tmp'
  - '**/.DS_Store'
feed:
  type: atom
  path: feed.xml
  limit: 20
  hub: null
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: '-date'
  icon: icon.png
  autodiscovery: true
  template: null
theme: edg-one-page
deploy:
  type: ''
localized_theme:
  title: EdgeOne Page
  subtitle: Modern bilingual publishing
  description: >-
    A Simplified Chinese and English Hexo site optimized for Tencent EdgeOne
    Pages.
  home_banner_title: EdgeOne Page
  home_banner_subtitles:
    - Fast, modern, and bilingual.
    - Chinese and English articles are stored separately and linked together.
    - Optimized for Tencent EdgeOne Pages.
  announcement: You are reading the English site. Switch to 简体中文 from the navigation bar.
  recommendation_title: Recommended reading
